spring.application.name=restaurante

# PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=restaurant
spring.datasource.password=restaurant
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Servidor
server.port=8080

# Initial Admin
app.initial-admin.name=${INITIAL_ADMIN_NAME:Administrador}
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# Sessão administrativa
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=RESTAURANT_ADMIN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false