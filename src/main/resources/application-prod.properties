spring.application.name=restaurante

# PostgreSQL produção
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Servidor
server.port=${PORT:8080}

# Proxy HTTPS
server.forward-headers-strategy=framework

# Sessão administrativa
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=RESTAURANT_ADMIN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# Initial Admin
app.initial-admin.name=${INITIAL_ADMIN_NAME:Administrador}
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# Logs
logging.level.root=INFO
logging.level.dev.elias.restaurante=INFO

# Não exibir stacktrace ao cliente
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false